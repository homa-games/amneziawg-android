amneziawgVersionCode=12
amneziawgVersionName=3.1.20260813
amneziawgPackageName=org.amnezia.awg

tunnelVersion=3.0.20260725

# Enable parallel project execution. More details:
# https://docs.gradle.org/current/userguide/multi_project_configuration_and_execution.html#sec:parallel_execution
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Enable Kotlin incremental compilation
kotlin.incremental=true

# Enable AndroidX support
android.useAndroidX=true

# 16 KB page size support: align native libraries in the APK to 16 KB boundaries
android.bundle.enableUncompressedNativeLibs=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Updated for modern Android projects with NDK support
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED

# Use Java 17+ for Gradle. Set JAVA_HOME or org.gradle.java.home if needed.
# On macOS with Homebrew: org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
# On Linux: org.gradle.java.home=/usr/lib/jvm/java-17-openjdk

# Kotlin daemon JVM args to allow KAPT access to internal JDK modules
kotlin.daemon.jvmargs=-Xmx4096m -Xms512m -XX:+UseG1GC --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED

# Turn off AP discovery in compile path to enable compile avoidance
kapt.include.compile.classpath=false

# Enable non-transitive R class namespacing where each library only contains
# references to the resources it declares instead of declarations plus all
# transitive dependency references.
android.nonTransitiveRClass=true

# Experimental AGP flags
# Generate compile-time only R class for app modules.
android.enableAppCompileTimeRClass=true
# Keep AAPT2 daemons alive between incremental builds.
android.keepWorkerActionServicesBetweenBuilds=true
# Make R fields non-final to improve build speeds.
# http://tools.android.com/tips/non-constant-fields
android.nonFinalResIds=true
# Enable the newly refactored resource shrinker.
android.experimental.enableNewResourceShrinker=true
# Enable precise shrinking in the new resource shrinker.
android.experimental.enableNewResourceShrinker.preciseShrinking=true
# Generate manifest class as a .class directly rather than a Java source file.
android.generateManifestClass=true
# Generate the text map of source sets and absolute paths to allow
# generating relative paths from absolute paths later in the build.
android.experimental.enableSourceSetPathsMap=true
# Use relative paths for better Gradle caching of library build tasks
android.experimental.cacheCompileLibResources=true

# Default Android build features
# Disable BuildConfig generation by default
android.defaults.buildfeatures.buildconfig=false
# Disable AIDL stub generation by default
android.defaults.buildfeatures.aidl=false
# Disable RenderScript compilation by default
android.defaults.buildfeatures.renderscript=false
# Disable resource values generation by default in libraries
android.defaults.buildfeatures.resvalues=false
# Disable shader compilation by default
android.defaults.buildfeatures.shaders=false
# Disable Android resource processing by default
android.library.defaults.buildfeatures.androidresources=false

# Suppress warnings for some features that aren't yet stabilized
android.suppressUnsupportedOptionWarnings=android.keepWorkerActionServicesBetweenBuilds,\
  android.experimental.enableNewResourceShrinker.preciseShrinking,\
  android.enableAppCompileTimeRClass,\
  android.suppressUnsupportedOptionWarnings

# OSSRH sometimes struggles with slow deployments, so this makes Gradle
# more tolerant to those delays.
systemProp.org.gradle.internal.http.connectionTimeout=500000
systemProp.org.gradle.internal.http.socketTimeout=500000

# IDE import settings: do not download dependency sources or Javadocs automatically.
# Sources and documentation can still be downloaded manually from Android Studio.
# Do not download dependency source JARs during Gradle project synchronization.
idea.gradle.download.sources=false
# Do not download dependency Javadoc during Gradle project synchronization.
idea.gradle.download.javadoc=false

# AGP compatibility settings retained for legacy dependency and R8 behavior.
# Enable dependency constraints across Android configurations.
android.dependency.useConstraints=true
# Preserve legacy R8 keep-rule semantics, including implicit default constructors.
android.r8.strictFullModeForKeepRules=false
# Use legacy resource shrinking instead of optimized code/resource analysis.
android.r8.optimizedResourceShrinking=false

# Use the external Kotlin Gradle Plugin instead of AGP built-in Kotlin support.
android.builtInKotlin=false
# Keep the legacy Android DSL and Variant API available to existing build logic.
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
