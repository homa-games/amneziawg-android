amneziawgPackageName=org.amnezia.awg

tunnelVersion=3.1.20260813

# Enable the build cache to reuse task outputs from previous builds.
org.gradle.caching=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Updated for modern Android projects with NDK support
org.gradle.jvmargs=-Xmx4096m -Xms512m

# Default Android build features
# Disable Android resource processing by default
android.library.defaults.buildfeatures.androidresources=false

# IDE import settings: do not download dependency sources or Javadocs automatically.
# Sources and documentation can still be downloaded manually from Android Studio.
# Do not download dependency source JARs during Gradle project synchronization.
idea.gradle.download.sources=false
# Do not download dependency Javadoc during Gradle project synchronization.
idea.gradle.download.javadoc=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
