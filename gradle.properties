amneziawgPackageName=org.amnezia.awg

tunnelVersion=3.1.20260813

# Enable parallel project execution. More details:
# https://docs.gradle.org/current/userguide/multi_project_configuration_and_execution.html#sec:parallel_execution
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=4

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Updated for modern Android projects with NDK support
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# Experimental AGP flags
# Keep AAPT2 daemons alive between incremental builds.
android.keepWorkerActionServicesBetweenBuilds=true
# Generate manifest class as a .class directly rather than a Java source file.
android.generateManifestClass=true

# Default Android build features
# Disable Android resource processing by default
android.library.defaults.buildfeatures.androidresources=false

# Suppress warnings for some features that aren't yet stabilized
android.suppressUnsupportedOptionWarnings=android.keepWorkerActionServicesBetweenBuilds,\
  android.suppressUnsupportedOptionWarnings

# OSSRH sometimes struggles with slow deployments, so this makes Gradle
# more tolerant to those delays.
systemProp.org.gradle.internal.http.connectionTimeout=500000
systemProp.org.gradle.internal.http.socketTimeout=500000

# IDE import settings: do not download dependency sources or Javadocs automatically.
# Sources and documentation can still be downloaded manually from Android Studio.
# Do not download dependency source JARs during Gradle project synchronization.
idea.gradle.download.sources=false
# Do not download dependency Javadoc during Gradle project synchronization.
idea.gradle.download.javadoc=false

# AGP compatibility settings retained for legacy dependency behavior.
# Enable dependency constraints across Android configurations.
android.dependency.useConstraints=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
